<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | SecureBank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="auth-card card border-0 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <a class="brand d-inline-flex align-items-center gap-2 text-decoration-none mb-4" href="/login">
          <span class="brand-mark">S</span><span>Secure<span class="brand-light">Bank</span></span>
        </a>
        <p class="eyebrow mb-2">LOCAL SECURITY LAB</p>
        <h1 class="h3 fw-bold mb-2">Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to your demo banking account.</p>
        <div id="notice" class="alert d-none" role="alert"></div>
        <form id="login-form">
          <label class="form-label" for="username">Username</label>
          <input class="form-control form-control-lg mb-3" id="username" name="username" autocomplete="username" required>
          <label class="form-label" for="password">Password</label>
          <input class="form-control form-control-lg mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="btn btn-primary btn-lg w-100" type="submit">Sign in securely</button>
        </form>
        <div class="demo-hint mt-4">
          <strong>Demo:</strong> alice / password123<br>
          <span>Attacker account: attacker / attacker123</span>
        </div>
        <p class="small text-secondary mt-4 mb-0">Transfers use POST and require a session-bound CSRF token. GET transfers are disabled.</p>
      </div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
