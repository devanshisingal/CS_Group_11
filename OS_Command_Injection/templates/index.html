<!DOCTYPE html>
<html>
<head>
    <title>OS Command Injection Mini-Project | IIIT Allahabad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4">Cyber Security (IT-30001) - OS Command Injection Demo</h2>
        
        <!-- VARIANT 1 CARD -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Variant 1: In-band (Ping Tool)</div>
            <div class="card-body">
                <form action="/inband" method="POST" class="mb-3">
                    <label class="form-label">Target IP / Domain (Vulnerable):</label>
                    <div class="input-group">
                        <input type="text" name="target" class="form-control" placeholder="e.g. 8.8.8.8; whoami" required>
                        <button class="btn btn-danger" type="submit">Run Vulnerable</button>
                    </div>
                </form>
                <form action="/inband-secure" method="POST">
                    <label class="form-label">Target IP / Domain (Secure / Mitigated):</label>
                    <div class="input-group">
                        <input type="text" name="target" class="form-control" placeholder="e.g. 8.8.8.8" required>
                        <button class="btn btn-success" type="submit">Run Secure</button>
                    </div>
                </form>
                {% if inband_output %}
                <div class="mt-3 p-3 bg-dark text-white rounded">
                    <pre>{{ inband_output }}</pre>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- VARIANT 2 CARD -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">Variant 2: Blind (Lookup Tool)</div>
            <div class="card-body">
                <form action="/blind" method="POST" class="mb-3">
                    <label class="form-label">Domain Name (Vulnerable):</label>
                    <div class="input-group">
                        <input type="text" name="domain" class="form-control" placeholder="e.g. example.com; sleep 5" required>
                        <button class="btn btn-danger" type="submit">Run Vulnerable</button>
                    </div>
                </form>
                <form action="/blind-secure" method="POST">
                    <label class="form-label">Domain Name (Secure / Mitigated):</label>
                    <div class="input-group">
                        <input type="text" name="domain" class="form-control" placeholder="e.g. example.com" required>
                        <button class="btn btn-success" type="submit">Run Secure</button>
                    </div>
                </form>
                {% if blind_output %}
                <div class="mt-3 p-3 bg-secondary text-white rounded">
                    <p>{{ blind_output }}</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
